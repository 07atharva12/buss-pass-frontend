<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Smart Bus Pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth">
  <aside class="auth-side on-dark">
    <a class="brand" href="index.html"><span class="brand-mark"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16"/><circle cx="8" cy="14.5" r=".8"/><circle cx="16" cy="14.5" r=".8"/><path d="M6.5 18v2.5M17.5 18v2.5"/></svg></span><span>Smart Bus Pass</span></a>

    <div class="board" role="img" aria-label="Bus destination board">
      <div class="board-row">
        <div class="board-no">1</div>
        <div>
          <div class="board-dest">Dadar</div>
          <div class="board-via">from Andheri</div>
        </div>
      </div>
    </div>

    <p class="auth-tag">Skip the counter. Apply from your phone.</p>
  </aside>

  <main class="auth-main">
    <div class="auth-form">
      <h1>Create your account</h1>
      <p class="sub">You'll use it to apply for and track your bus pass.</p>

      <div class="notice" id="addBanner" hidden></div>

      <form id="registerForm" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" placeholder="Your full name" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="phone">Phone number</label>
          <input type="tel" id="phone" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" autocomplete="tel" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" autocomplete="new-password" required>
          <div class="error-text" id="regError" role="alert"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Create account</button>
      </form>

      <p class="switch">Already registered? <a href="login.html" id="loginLink">Log in</a></p>
    </div>
  </main>
</div>

<script src="js/app.js"></script>
<script>
(function () {
  const addMode = new URLSearchParams(window.location.search).get('add') === '1';
  const existing = getCurrentUser();

  if (addMode && existing) {
    const banner = document.getElementById('addBanner');
    banner.innerHTML = 'This adds a new account next to the one you are signed in to. ' +
      '<a href="' + homeFor(existing) + '">Cancel</a>';
    banner.hidden = false;
    document.getElementById('loginLink').href = 'login.html?add=1';
  }

  document.getElementById('registerForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const errorBox = document.getElementById('regError');
    const btn = document.getElementById('submitBtn');
    errorBox.style.display = 'none';

    function fail(message) {
      setBusy(btn, false);
      errorBox.textContent = message;
      errorBox.style.display = 'block';
    }

    // Same rules the server checks, so people get the message straight away
    if (name.length < 2) return fail('Name must be at least 2 characters.');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fail('Enter a valid email address.');
    if (!/^\d{10}$/.test(phone)) return fail('Phone number must be exactly 10 digits.');
    if (password.length < 6) return fail('Password must be at least 6 characters.');

    setBusy(btn, true, 'Creating account...');
    const result = await registerUser({ name: name, email: email, phone: phone, password: password });
    if (!result.ok) return fail(result.message);

    // Sign the new account in. If someone was already signed in, they stay signed in too.
    const login = await loginUser(email, password);
    if (!login.ok) return fail(login.message);
    if (existing) flash('Account created. You are now using ' + login.user.name + '.');
    window.location.href = homeFor(login.user);
  });
})();
</script>
</body>
</html>
