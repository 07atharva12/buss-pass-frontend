<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in - Smart Bus Pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth">
  <aside class="auth-side on-dark">
    <a class="brand" href="index.html"><span class="brand-mark"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16"/><circle cx="8" cy="14.5" r=".8"/><circle cx="16" cy="14.5" r=".8"/><path d="M6.5 18v2.5M17.5 18v2.5"/></svg></span><span>Smart Bus Pass</span></a>

    <div class="board" role="img" aria-label="Bus destination board: route 12 to Tech Park">
      <div class="board-row">
        <div class="board-no">12</div>
        <div>
          <div class="board-dest">Tech Park</div>
          <div class="board-via">from City Center</div>
        </div>
      </div>
    </div>

    <p class="auth-tag">Apply online. Ride with a QR code.</p>
  </aside>

  <main class="auth-main">
    <div class="auth-form">
      <h1 id="authTitle">Log in</h1>
      <p class="sub" id="authSub">Manage your bus pass.</p>

      <div class="notice" id="addBanner" hidden></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Your password" autocomplete="current-password" required>
          <div class="error-text" id="loginError" role="alert"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Log in</button>
      </form>

      <p class="switch">No account yet? <a href="register.html" id="registerLink">Register</a></p>

      <div class="demo">
        <p>Demo accounts for this project</p>
        <div class="row">
          <button type="button" class="btn btn-outline btn-sm" data-fill="rahul@example.com|pass123">Fill user login</button>
          <button type="button" class="btn btn-outline btn-sm" data-fill="admin@bpms.com|admin123">Fill admin login</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="js/app.js"></script>
<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const addMode = params.get('add') === '1';
  const existing = getCurrentUser();

  // Already signed in and not adding another account: go straight to the right home page
  if (existing && !addMode) { window.location.href = homeFor(existing); return; }

  if (addMode && existing) {
    const n = getSignedInAccounts().length;
    document.getElementById('authTitle').textContent = 'Add another account';
    document.getElementById('authSub').textContent = 'Log in to a second account without leaving the first.';
    document.getElementById('submitBtn').textContent = 'Add account';
    const banner = document.getElementById('addBanner');
    banner.innerHTML = 'You are signed in to ' + n + (n === 1 ? ' account' : ' accounts') +
      '. Both stay signed in, and you can switch from the top bar. ' +
      '<a href="' + homeFor(existing) + '">Cancel</a>';
    banner.hidden = false;
    document.getElementById('registerLink').href = 'register.html?add=1';
  }

  document.querySelectorAll('[data-fill]').forEach(function (b) {
    b.addEventListener('click', function () {
      const parts = b.dataset.fill.split('|');
      document.getElementById('email').value = parts[0];
      document.getElementById('password').value = parts[1];
    });
  });

  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorBox = document.getElementById('loginError');

    if (!email || !password) {
      errorBox.textContent = 'Enter your email and password.';
      errorBox.style.display = 'block';
      return;
    }
    const result = loginUser(email, password);
    if (!result.ok) {
      errorBox.textContent = result.message;
      errorBox.style.display = 'block';
      return;
    }
    if (addMode) flash('Signed in as ' + result.user.name + '.');
    window.location.href = homeFor(result.user);
  });
})();
</script>
</body>
</html>
