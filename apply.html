<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply for a pass - Smart Bus Pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="topbar"></header>

<main class="wrap page">
  <div class="page-head">
    <h1>Apply for a bus pass</h1>
    <p>Choose your route and pass type. An admin will review your application.</p>
  </div>

  <div class="apply-grid">
    <form class="card" id="applyForm" novalidate>
      <div class="field">
        <label for="route">Route</label>
        <select id="route" required><option value="">Loading routes...</option></select>
        <div class="form-hint" id="routeHint"></div>
      </div>

      <div class="field">
        <span class="label" id="typeLabel">Pass type</span>
        <div class="tiles" id="passTiles" role="radiogroup" aria-labelledby="typeLabel"></div>
      </div>

      <div class="field">
        <span class="label" id="tripLabel">Trip type</span>
        <div class="tiles tiles-2" id="tripTiles" role="radiogroup" aria-labelledby="tripLabel"></div>
      </div>

      <div class="error-text" id="applyError" role="alert" style="margin-bottom:14px;"></div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Submit application</button>
    </form>

    <aside class="summary on-dark" aria-live="polite">
      <h2>Your pass</h2>
      <div class="route-line">
        <span class="plate plate-lg" id="sumPlate" style="opacity:.35">--</span>
        <span class="route-name" id="sumRoute">Choose a route</span>
      </div>
      <dl>
        <div><dt>Pass type</dt><dd id="sumType">Not chosen</dd></div>
        <div><dt>Trip</dt><dd id="sumTrip">One-way</dd></div>
        <div><dt>Valid for</dt><dd id="sumDays">-</dd></div>
      </dl>
      <div class="total"><span id="amountLabel">Route fare</span><b id="amountPreview">₹0</b></div>
    </aside>
  </div>
</main>

<script src="js/app.js"></script>
<script>
(function () {
  const user = requireUser();
  if (!user) return;
  initNavbar('apply');

  const routeSel = document.getElementById('route');
  const btn = document.getElementById('submitBtn');
  const errorBox = document.getElementById('applyError');
  let routes = [];

  /* Pass type tiles come from PASS_TYPES in js/app.js */
  document.getElementById('passTiles').innerHTML = Object.keys(PASS_TYPES).map(function (key, i) {
    const p = PASS_TYPES[key];
    return '<label class="tile"><input type="radio" name="passType" value="' + key + '"' + (i === 0 ? ' required' : '') + '>' +
      '<span class="tile-body"><span class="tile-name">' + p.label + '</span>' +
      '<span class="tile-price" data-price="' + key + '">' + plural(p.days, 'day') + '</span>' +
      '<span class="tile-sub" data-sub="' + key + '">from approval</span></span></label>';
  }).join('');

  /* Trip type tiles: One-way is selected by default (the backend default as well) */
  document.getElementById('tripTiles').innerHTML = Object.keys(TRIP_TYPES).map(function (key, i) {
    return '<label class="tile"><input type="radio" name="tripType" value="' + key + '"' + (i === 0 ? ' checked' : '') + '>' +
      '<span class="tile-body"><span class="tile-name">' + TRIP_TYPES[key].label + '</span>' +
      '<span class="tile-price" data-trip-price="' + key + '">&nbsp;</span>' +
      '<span class="tile-sub">' + TRIP_TYPES[key].note + '</span></span></label>';
  }).join('');

  function chosenTrip() {
    const el = document.querySelector('input[name="tripType"]:checked');
    return el ? el.value : 'one_way';
  }
  function chosenType() {
    const el = document.querySelector('input[name="passType"]:checked');
    return el ? el.value : '';
  }
  function chosenRoute() {
    return routes.find(function (r) { return String(r.id) === routeSel.value; }) || null;
  }

  /* Prices for the chosen route: { monthly, quarterly, yearly }, or null until they load */
  let pricing = null, loadingPrice = false, priceRequest = 0;

  /* Tiles show each type's price once it is known, otherwise how long it lasts */
  function updateTiles() {
    const trip = chosenTrip(), type = chosenType();
    Object.keys(PASS_TYPES).forEach(function (key) {
      const price = priceFor(pricing, key, trip);
      document.querySelector('[data-price="' + key + '"]').textContent = price != null ? money(price) : plural(PASS_TYPES[key].days, 'day');
      document.querySelector('[data-sub="' + key + '"]').textContent = price != null ? plural(PASS_TYPES[key].days, 'day') : 'from approval';
    });
    Object.keys(TRIP_TYPES).forEach(function (key) {
      const price = priceFor(pricing, type, key);      // price of this trip type for the chosen pass type
      document.querySelector('[data-trip-price="' + key + '"]').textContent = price != null ? money(price) : '\u00a0';
    });
  }

  function updateSummary() {
    const r = chosenRoute();
    const type = chosenType();
    const plate = document.getElementById('sumPlate');
    plate.textContent = r ? r.route_number : '--';
    plate.style.opacity = r ? '1' : '.35';
    document.getElementById('sumRoute').textContent = r ? routeName(r) : 'Choose a route';
    const trip = chosenTrip();
    document.getElementById('sumType').textContent = type ? PASS_TYPES[type].label : 'Not chosen';
    document.getElementById('sumTrip').textContent = TRIP_TYPES[trip].label;
    document.getElementById('sumDays').textContent = type ? plural(PASS_TYPES[type].days, 'day') + ' from approval' : '-';

    // Amount: the price of the chosen pass type. If prices could not be loaded, fall back to the flat route fare.
    const label = document.getElementById('amountLabel');
    const amount = document.getElementById('amountPreview');
    if (loadingPrice) { label.textContent = 'Amount payable'; amount.textContent = '...'; }
    else if (pricing) {
      label.textContent = 'Amount payable';
      const price = priceFor(pricing, type, trip);
      amount.textContent = price != null ? money(price) : '-';
    } else {
      // No prices available: show the flat route fare (round trip is exactly double)
      label.textContent = 'Route fare';
      amount.textContent = money(r ? r.fare * (trip === 'round_trip' ? 2 : 1) : 0);
    }
  }

  routeSel.addEventListener('change', async function () {
    pricing = null;
    updateTiles();
    const r = chosenRoute();
    if (!r) { loadingPrice = false; updateSummary(); return; }
    const request = ++priceRequest;              // ignore answers for a route the person already left
    loadingPrice = true;
    updateSummary();
    try {
      const d = await fetchPricing(r.id);
      if (request !== priceRequest) return;
      pricing = d.pricing || null;
      if (pricing && !isTripPricing(pricing)) {
        // The backend sent one price per pass type with no one-way / round-trip split
        console.warn('Pricing reply is not split by trip type (expected pricing[pass_type][trip_type]):', d);
        pricing = null;
      }
    } catch (e) {
      if (request !== priceRequest) return;
      pricing = null;
    }
    loadingPrice = false;
    updateTiles();
    updateSummary();
  });
  function onChoiceChange() { updateTiles(); updateSummary(); }
  document.getElementById('passTiles').addEventListener('change', onChoiceChange);
  document.getElementById('tripTiles').addEventListener('change', onChoiceChange);

  async function loadRoutes() {
    try {
      routes = await fetchRoutes();
      if (!routes.length) {
        routeSel.innerHTML = '<option value="">No routes available yet</option>';
        document.getElementById('routeHint').textContent = 'An admin needs to add routes before you can apply.';
        btn.disabled = true;
        return;
      }
      routeSel.innerHTML = '<option value="">Choose a route</option>' +
        routes.map(function (r) { return '<option value="' + r.id + '">' + esc(routeLabel(r)) + '</option>'; }).join('');
    } catch (e) {
      routeSel.innerHTML = '<option value="">Could not load routes</option>';
      document.getElementById('routeHint').textContent = e.message;
      btn.disabled = true;
    }
  }
  loadRoutes();

  document.getElementById('applyForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    errorBox.style.display = 'none';
    const type = chosenType();
    if (!routeSel.value) { errorBox.textContent = 'Choose a route.'; errorBox.style.display = 'block'; return; }
    if (!type) { errorBox.textContent = 'Choose a pass type.'; errorBox.style.display = 'block'; return; }

    setBusy(btn, true, 'Submitting...');
    try {
      const res = await applyForPass(routeSel.value, type, chosenTrip());
      const id = 'BP-' + String(res.application.id).padStart(4, '0');
      showToast('Application submitted. Your ID is ' + id + '.');
      setTimeout(function () { window.location.href = 'track.html'; }, 1000);
    } catch (err) {
      setBusy(btn, false);
      if (err.silent) return;
      errorBox.textContent = err.message;      // e.g. "You already have a pending application for this route."
      errorBox.style.display = 'block';
    }
  });
})();
</script>
</body>
</html>
