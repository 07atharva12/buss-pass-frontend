<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply for a pass - Smart Bus Pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="topbar"></header>

<main class="wrap page">
  <div class="page-head">
    <h1>Apply for a bus pass</h1>
    <p>Fill in the details and submit. An admin will review your application.</p>
  </div>

  <div class="apply-grid">
    <form class="card" id="applyForm">
      <div class="field">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" autocomplete="name" required>
      </div>

      <div class="field">
        <label for="route">Route</label>
        <select id="route" required></select>
      </div>

      <div class="field">
        <span class="label" id="typeLabel">Pass type</span>
        <div class="tiles" id="passTiles" role="radiogroup" aria-labelledby="typeLabel"></div>
      </div>

      <div class="field">
        <label for="pickup">Pickup point</label>
        <input type="text" id="pickup" placeholder="e.g. Main Bus Stand" required>
      </div>

      <div class="field">
        <label for="idProof">ID proof number (Aadhar or college ID)</label>
        <input type="text" id="idProof" placeholder="Used only to verify your identity" required>
        <div class="form-hint">It is not shown to anyone except the reviewing admin.</div>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Submit application</button>
    </form>

    <aside class="summary on-dark" aria-live="polite">
      <h2>Your pass</h2>
      <div class="route-line">
        <span class="plate plate-lg" id="sumPlate" style="opacity:.35">--</span>
        <span class="route-name" id="sumRoute">Choose a route</span>
      </div>
      <dl>
        <div><dt>Pass type</dt><dd id="sumType">Not chosen</dd></div>
        <div><dt>Valid for</dt><dd id="sumDays">-</dd></div>
      </dl>
      <div class="total"><span>Amount payable</span><b id="amountPreview">₹0</b></div>
    </aside>
  </div>
</main>

<script src="js/app.js"></script>
<script>
(function () {
  const user = requireUser();
  if (!user) return;
  initNavbar('apply');

  document.getElementById('fullName').value = user.name;

  /* Route dropdown + pass tiles are built from ROUTES and PASS_TYPES in js/app.js */
  const routeSel = document.getElementById('route');
  routeSel.innerHTML = '<option value="">Choose a route</option>' +
    ROUTES.map(function (r) { return '<option value="' + esc(routeValue(r)) + '">' + esc(routeValue(r)) + '</option>'; }).join('');

  document.getElementById('passTiles').innerHTML = Object.keys(PASS_TYPES).map(function (name, i) {
    const p = PASS_TYPES[name];
    return '<label class="tile"><input type="radio" name="passType" value="' + name + '"' + (i === 0 ? ' required' : '') + '>' +
      '<span class="tile-body"><span class="tile-name">' + name + '</span>' +
      '<span class="tile-price">₹' + p.price.toLocaleString('en-IN') + '</span>' +
      '<span class="tile-sub">' + p.days + ' days</span></span></label>';
  }).join('');

  function chosenType() {
    const el = document.querySelector('input[name="passType"]:checked');
    return el ? el.value : '';
  }

  function updateSummary() {
    const route = routeSel.value;
    const type = chosenType();
    const plate = document.getElementById('sumPlate');
    plate.textContent = route ? routeNo(route) : '--';
    plate.style.opacity = route ? '1' : '.35';
    document.getElementById('sumRoute').textContent = route ? routeName(route) : 'Choose a route';
    document.getElementById('sumType').textContent = type || 'Not chosen';
    document.getElementById('sumDays').textContent = type ? PASS_TYPES[type].days + ' days from approval' : '-';
    document.getElementById('amountPreview').textContent = '₹' + (type ? PASS_TYPES[type].price.toLocaleString('en-IN') : 0);
  }
  routeSel.addEventListener('change', updateSummary);
  document.getElementById('passTiles').addEventListener('change', updateSummary);

  document.getElementById('applyForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const passType = chosenType();
    const app = submitApplication({
      userEmail: user.email,
      name: document.getElementById('fullName').value.trim(),
      route: routeSel.value,
      pickup: document.getElementById('pickup').value.trim(),
      idProof: document.getElementById('idProof').value.trim(),
      passType: passType,
      amount: PASS_TYPES[passType].price
    });
    showToast('Application submitted. Your ID is ' + app.id + '.');
    setTimeout(function () { window.location.href = 'track.html'; }, 1000);
  });
})();
</script>
</body>
</html>
