<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Smart Bus Pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="topbar"></header>

<main class="wrap page">
  <div class="page-head">
    <h1 id="welcomeMsg">Welcome back</h1>
    <p>Your bus pass activity at a glance.</p>
  </div>

  <div id="passPeek"></div>
  <div class="stats" id="statCards"></div>

  <section class="card">
    <div class="card-head">
      <h2>Recent applications</h2>
      <a class="btn btn-primary btn-sm" href="apply.html">New application</a>
    </div>
    <div id="recentApplications"></div>
  </section>
</main>

<script src="js/app.js"></script>
<script>
(function () {
  const user = requireUser();
  if (!user) return;
  initNavbar('dashboard');

  document.getElementById('welcomeMsg').textContent = 'Welcome back, ' + user.name.split(' ')[0];

  const apps = getUserApplications(user.email);
  const approved = apps.filter(function (a) { return a.status === 'approved'; });
  const pending = apps.filter(function (a) { return a.status === 'pending'; }).length;
  const rejected = apps.filter(function (a) { return a.status === 'rejected'; }).length;

  /* Current pass */
  const peek = document.getElementById('passPeek');
  if (approved.length) {
    const p = approved[0];
    const left = daysLeft(p.expiryDate);
    peek.innerHTML =
      '<div class="peek on-dark">' +
        '<div class="peek-main">' + plateHTML(p.route, true) +
          '<div><div class="route-name">' + esc(routeName(p.route)) + '</div>' +
          '<small>' + esc(p.passType) + ' pass, valid till ' + formatDate(p.expiryDate) + '</small></div></div>' +
        '<div class="peek-meter"><div class="meter-label"><span>Time left</span><span>' + plural(left, 'day') + '</span></div>' +
          '<div class="meter on-dark-meter"><i style="width:' + validityPercent(p) + '%"></i></div></div>' +
        '<a class="btn btn-accent" href="mypass.html">Show my pass</a>' +
      '</div>';
  } else {
    peek.innerHTML =
      '<div class="peek empty">' +
        '<div class="peek-main"><span class="plate plate-lg" style="opacity:.35">--</span>' +
          '<div><div class="route-name">No active pass</div><small>Apply for a pass to get your QR code.</small></div></div>' +
        '<a class="btn btn-primary" href="apply.html">Apply for a pass</a>' +
      '</div>';
  }

  /* Numbers */
  document.getElementById('statCards').innerHTML =
    '<div class="stat"><div class="stat-num">' + apps.length + '</div><div class="stat-label"><span class="dot"></span>Applications</div></div>' +
    '<div class="stat"><div class="stat-num">' + approved.length + '</div><div class="stat-label"><span class="dot ok"></span>Approved</div></div>' +
    '<div class="stat"><div class="stat-num">' + pending + '</div><div class="stat-label"><span class="dot warn"></span>Pending review</div></div>' +
    '<div class="stat"><div class="stat-num">' + rejected + '</div><div class="stat-label"><span class="dot bad"></span>Rejected</div></div>';

  /* Table */
  const box = document.getElementById('recentApplications');
  if (apps.length === 0) {
    box.innerHTML = emptyState('ticket', 'You have not applied for a pass yet.', 'apply.html', 'Apply for a pass', true);
    return;
  }
  box.innerHTML =
    '<div class="table-wrap"><table>' +
      '<thead><tr><th>Pass ID</th><th>Route</th><th>Type</th><th>Applied on</th><th>Status</th></tr></thead>' +
      '<tbody>' +
      apps.slice(0, 5).map(function (a) {
        return '<tr>' +
          '<td class="pass-id">' + esc(a.id) + '</td>' +
          '<td><div class="cell-route">' + plateHTML(a.route) + '<span>' + esc(routeName(a.route)) + '</span></div></td>' +
          '<td>' + esc(a.passType) + '</td>' +
          '<td>' + formatDate(a.appliedDate) + '</td>' +
          '<td>' + badgeForStatus(a.status) + '</td>' +
        '</tr>';
      }).join('') +
      '</tbody></table></div>';
})();
</script>
</body>
</html>
