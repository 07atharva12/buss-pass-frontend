<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin panel - Smart Bus Pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="topbar"></header>

<main class="wrap page">
  <div class="page-head">
    <h1>Applications</h1>
    <p>Review, approve and reject bus pass applications.</p>
  </div>

  <div class="stats" id="adminStats"></div>

  <section class="card">
    <div class="card-head">
      <h2>All applications</h2>
      <div class="filters">
        <select id="filterStatus" class="control" style="width:auto;" aria-label="Filter by status">
          <option value="all">All statuses</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
          <option value="expired">Expired</option>
        </select>
        <div class="search">
          <span class="ic-slot" aria-hidden="true"></span>
          <input type="search" id="searchBox" class="control" placeholder="Search name, ID or route" aria-label="Search applications">
        </div>
      </div>
    </div>
    <div id="adminTable"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>Add a route</h2></div>
    <p class="route-note">New routes show up in the Apply form straight away.</p>
    <form class="route-form" id="routeForm" novalidate>
      <div class="field"><label for="rNumber">Route number</label><input type="text" id="rNumber" placeholder="e.g. 12" required></div>
      <div class="field"><label for="rSource">From</label><input type="text" id="rSource" placeholder="e.g. Andheri" required></div>
      <div class="field"><label for="rDest">To</label><input type="text" id="rDest" placeholder="e.g. Dadar" required></div>
      <div class="field"><label for="rFare">Fare (₹)</label><input type="number" id="rFare" min="1" step="any" placeholder="e.g. 600" required></div>
      <button type="submit" class="btn btn-primary" id="routeBtn">Add route</button>
    </form>
    <div class="error-text" id="routeError" role="alert"></div>
  </section>
</main>

<dialog id="rejectDialog" class="dialog" aria-labelledby="rejectTitle">
  <div class="dialog-body">
    <h2 id="rejectTitle">Reject application</h2>
    <p class="dialog-sub" id="rejectSub"></p>
    <div class="field">
      <label for="rejectReason">Reason</label>
      <select id="rejectReason"></select>
      <div class="error-text" id="rejectError" role="alert"></div>
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn btn-ghost" id="rejectCancel">Cancel</button>
      <button type="button" class="btn btn-bad" id="rejectConfirm">Reject application</button>
    </div>
  </div>
</dialog>

<script src="js/app.js"></script>
<script>
(function () {
  const admin = requireAdmin();
  if (!admin) return;
  initNavbar('admin');

  // Search icon (kept in JS so it uses the same icon set as the rest of the app)
  document.querySelector('.ic-slot').outerHTML = icon('search', 18);

  const table = document.getElementById('adminTable');
  let all = [];

  /* The applicant's name only appears if the backend sends it (see README notes) */
  function applicantName(a) { return a.user_name || ('User #' + a.user_id); }

  function render() {
    const statusFilter = document.getElementById('filterStatus').value;
    const search = document.getElementById('searchBox').value.trim().toLowerCase();

    const filtered = all.filter(function (a) {
      const okStatus = statusFilter === 'all' || a.state === statusFilter;
      const hay = (applicantName(a) + ' ' + a.passId + ' ' + (a.route ? a.route.route_number + ' ' + routeName(a.route) : '')).toLowerCase();
      return okStatus && (!search || hay.indexOf(search) >= 0);
    });

    const count = function (s) { return all.filter(function (a) { return a.state === s; }).length; };
    document.getElementById('adminStats').innerHTML =
      '<div class="stat"><div class="stat-num">' + all.length + '</div><div class="stat-label"><span class="dot"></span>Total applications</div></div>' +
      '<div class="stat"><div class="stat-num">' + count('pending') + '</div><div class="stat-label"><span class="dot warn"></span>Pending review</div></div>' +
      '<div class="stat"><div class="stat-num">' + count('approved') + '</div><div class="stat-label"><span class="dot ok"></span>Active passes</div></div>' +
      '<div class="stat"><div class="stat-num">' + count('rejected') + '</div><div class="stat-label"><span class="dot bad"></span>Rejected</div></div>';

    if (filtered.length === 0) {
      table.innerHTML = emptyState('inbox', all.length
        ? 'No applications match these filters. Clear the search or pick another status.'
        : 'No applications yet.', null, null, true);
      return;
    }

    table.innerHTML =
      '<div class="table-wrap"><table>' +
        '<thead><tr><th>Pass ID</th><th>Applicant</th><th>Route</th><th>Type</th><th>Applied</th><th>Status</th><th>Action</th></tr></thead>' +
        '<tbody>' +
        filtered.map(function (a) {
          return '<tr>' +
            '<td class="pass-id">' + esc(a.passId) + '</td>' +
            '<td>' + esc(applicantName(a)) + (a.user_email ? '<span class="sub-line">' + esc(a.user_email) + '</span>' : '') + '</td>' +
            '<td><div class="cell-route">' + plateHTML(a.route) + '<span>' + esc(routeName(a.route)) + '</span></div></td>' +
            '<td>' + esc(a.typeLabel) + '<span class="sub-line">' + esc(a.tripLabel) + '</span></td>' +
            '<td>' + formatDate(a.applied_on) + '</td>' +
            '<td>' + badgeForStatus(a.state) + (a.rejection_reason ? '<span class="sub-line">' + esc(a.rejection_reason) + '</span>' : '') + '</td>' +
            '<td>' + (a.status === 'pending'
              ? '<div class="flex gap-10">' +
                  '<button type="button" class="btn btn-success btn-sm" data-act="approve" data-id="' + a.id + '">Approve</button>' +
                  '<button type="button" class="btn btn-danger btn-sm" data-act="reject" data-id="' + a.id + '">Reject</button>' +
                '</div>'
              : '<span class="text-muted">None</span>') + '</td>' +
          '</tr>';
        }).join('') +
        '</tbody></table></div>';
  }

  async function load() {
    table.innerHTML = loadingHTML();
    try { all = await fetchAllApplications(); render(); }
    catch (e) { document.getElementById('adminStats').innerHTML = ''; showError(table, e, load); }
  }

  /* Rejecting asks for a reason first */
  const dlg = document.getElementById('rejectDialog');
  const reasonSel = document.getElementById('rejectReason');
  const reasonErr = document.getElementById('rejectError');
  const confirmBtn = document.getElementById('rejectConfirm');
  let rejectId = null;
  reasonSel.innerHTML = '<option value="">Choose a reason</option>' +
    REJECTION_REASONS.map(function (r) { return '<option value="' + esc(r) + '">' + esc(r) + '</option>'; }).join('');

  function openReject(id) {
    rejectId = id;
    const a = all.find(function (x) { return String(x.id) === String(id); });
    document.getElementById('rejectSub').textContent = a ? a.passId + ', ' + routeName(a.route) + ' (' + applicantName(a) + ')' : '';
    reasonSel.value = '';
    reasonErr.style.display = 'none';
    dlg.showModal();
    reasonSel.focus();
  }
  document.getElementById('rejectCancel').addEventListener('click', function () { dlg.close(); });
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });   // click on the dark backdrop
  confirmBtn.addEventListener('click', async function () {
    if (!reasonSel.value) {
      reasonErr.textContent = 'Choose a reason.';
      reasonErr.style.display = 'block';
      return;
    }
    setBusy(confirmBtn, true, 'Rejecting...');
    try {
      await setApplicationStatus(rejectId, 'reject', reasonSel.value);
      setBusy(confirmBtn, false);
      dlg.close();
      showToast('Application rejected.', true);
      load();
    } catch (err) {
      setBusy(confirmBtn, false);
      if (err.silent) return;
      reasonErr.textContent = err.message;
      reasonErr.style.display = 'block';
    }
  });

  table.addEventListener('click', async function (e) {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    if (btn.dataset.act === 'reject') { openReject(btn.dataset.id); return; }
    const row = btn.closest('tr');
    row.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
    try {
      await setApplicationStatus(btn.dataset.id, btn.dataset.act);
      showToast(btn.dataset.act === 'approve' ? 'Application approved.' : 'Application rejected.', btn.dataset.act === 'reject');
      load();
    } catch (err) {
      row.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
      if (!err.silent) showToast(err.message, true);
    }
  });
  document.getElementById('filterStatus').addEventListener('change', render);
  document.getElementById('searchBox').addEventListener('input', render);

  /* Add a route */
  document.getElementById('routeForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const errorBox = document.getElementById('routeError');
    const btn = document.getElementById('routeBtn');
    errorBox.style.display = 'none';
    const route = {
      route_number: document.getElementById('rNumber').value.trim(),
      source: document.getElementById('rSource').value.trim(),
      destination: document.getElementById('rDest').value.trim(),
      fare: document.getElementById('rFare').value
    };
    if (!route.route_number || !route.source || !route.destination || !route.fare) {
      errorBox.textContent = 'Fill in every field.';
      errorBox.style.display = 'block';
      return;
    }
    setBusy(btn, true, 'Adding...');
    try {
      await addRoute(route);
      showToast('Route ' + route.route_number + ' added.');
      e.target.reset();
      setBusy(btn, false);
    } catch (err) {
      setBusy(btn, false);
      if (err.silent) return;
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });

  load();
})();
</script>
</body>
</html>
