<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track status - Smart Bus Pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="topbar"></header>

<main class="wrap page">
  <div class="page-head">
    <h1>Track your applications</h1>
    <p>Where each pass you applied for stands right now.</p>
  </div>

  <div id="appList"></div>
</main>

<script src="js/app.js"></script>
<script>
(function () {
  const user = requireUser();
  if (!user) return;
  initNavbar('track');

  const box = document.getElementById('appList');

  /* Three steps: Applied, Under review, then the outcome */
  function stepper(state) {
    const check = icon('check', 15), cross = icon('x', 15), clock = icon('clock', 15);
    let s2, s3, last = 'Approved';
    if (state === 'pending') { s2 = 'current'; s3 = ''; }
    else if (state === 'approved') { s2 = 'done'; s3 = 'done'; }
    else if (state === 'rejected') { s2 = 'done'; s3 = 'bad'; last = 'Rejected'; }
    else { s2 = 'done'; s3 = 'off'; last = 'Expired'; }
    return '<div class="steps" aria-label="Application progress">' +
      '<div class="step done"><span class="step-dot">' + check + '</span>Applied</div>' +
      '<div class="step ' + s2 + '"><span class="step-dot">' + (s2 === 'done' ? check : clock) + '</span>Under review</div>' +
      '<div class="step ' + s3 + '"><span class="step-dot">' +
        (s3 === 'done' ? check : s3 === 'bad' ? cross : s3 === 'off' ? clock : '') + '</span>' + last + '</div>' +
    '</div>';
  }

  function render(apps) {
    if (apps.length === 0) {
      box.innerHTML = '<div class="card">' + emptyState('inbox', 'No applications yet.', 'apply.html', 'Apply for a pass') + '</div>';
      return;
    }
    box.innerHTML = apps.map(function (a) {
      const isRejected = a.state === 'rejected';
      const isExpired = a.state === 'expired';
      // A pass that was renewed early is marked expired by the backend before its end date
      const endedEarly = isExpired && a.expiry && a.expiry.getTime() > Date.now();
      const dateLabel = isRejected || endedEarly ? 'Outcome' : isExpired ? 'Expired on' : 'Valid till';
      const dateValue = isRejected ? 'Rejected' : endedEarly ? 'Renewed' : (a.expiry ? formatDate(a.expiry) : 'Awaiting approval');

      // Renewing is only allowed by the backend while the pass is still "approved"
      let action = '';
      if (a.status === 'approved') {
        action = (a.state === 'approved' ? '<a class="btn btn-outline btn-sm" href="mypass.html">Show pass</a> ' : '') +
          '<button type="button" class="btn btn-outline btn-sm" data-renew="' + a.id + '">Renew</button>';
      } else if (isRejected || isExpired) {
        action = '<a class="btn btn-outline btn-sm" href="apply.html">Apply again</a>';
      }

      return '' +
      '<article class="card">' +
        '<div class="track-top">' +
          '<div class="track-id">' + plateHTML(a.route, true) +
            '<div><span class="pass-id">' + esc(a.passId) + '</span><span class="sub-line">' + esc(routeName(a.route)) + '</span></div>' +
            badgeForStatus(a.state) +
          '</div>' +
          '<div class="flex gap-10">' + action + '</div>' +
        '</div>' +
        '<dl class="kv">' +
          '<div><dt>Pass type</dt><dd>' + esc(a.typeLabel) + ' (' + esc(a.tripLabel) + ')</dd></div>' +
          // the backend now stores the amount for each application; older ones fall back to the route fare
          (a.amount != null
            ? '<div><dt>Amount</dt><dd>' + money(a.amount) + '</dd></div>'
            : '<div><dt>Route fare</dt><dd>' + (a.route ? money(a.route.fare) : '-') + '</dd></div>') +
          '<div><dt>Applied on</dt><dd>' + formatDate(a.applied_on) + '</dd></div>' +
          '<div><dt>' + dateLabel + '</dt><dd>' + dateValue + '</dd></div>' +
        '</dl>' +
        (isRejected && a.rejection_reason ? '<div class="reason"><b>Why it was rejected:</b> ' + esc(a.rejection_reason) + '</div>' : '') +
        stepper(a.state) +
      '</article>';
    }).join('');
  }

  async function load() {
    box.innerHTML = loadingHTML();
    try { render(await fetchMyApplications()); }
    catch (e) { showError(box, e, load); }
  }

  box.addEventListener('click', async function (e) {
    const btn = e.target.closest('button[data-renew]');
    if (!btn) return;
    if (!window.confirm('Renew this pass?\n\nThe current pass is marked expired and a new request is sent for approval.')) return;
    setBusy(btn, true, 'Renewing...');
    try {
      await renewPass(btn.dataset.renew);
      showToast('Renewal submitted for approval.');
      load();
    } catch (err) {
      setBusy(btn, false);
      if (!err.silent) showToast(err.message, true);
    }
  });

  load();
})();
</script>
</body>
</html>
