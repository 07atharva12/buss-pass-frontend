<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track status - Smart Bus Pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="topbar"></header>

<main class="wrap page">
  <div class="page-head">
    <h1>Track your applications</h1>
    <p>Where each pass you applied for stands right now.</p>
  </div>

  <div id="appList"></div>
</main>

<script src="js/app.js"></script>
<script>
(function () {
  const user = requireUser();
  if (!user) return;
  initNavbar('track');

  const apps = getUserApplications(user.email);
  const box = document.getElementById('appList');

  if (apps.length === 0) {
    box.innerHTML = '<div class="card">' + emptyState('inbox', 'No applications yet.', 'apply.html', 'Apply for a pass') + '</div>';
    return;
  }

  /* Three steps: Applied, Under review, then the outcome */
  function stepper(status) {
    const check = icon('check', 15), cross = icon('x', 15), clock = icon('clock', 15);
    let s1 = 'done', s2, s3, last = 'Approved';
    if (status === 'pending') { s2 = 'current'; s3 = ''; }
    else if (status === 'approved') { s2 = 'done'; s3 = 'done'; }
    else if (status === 'rejected') { s2 = 'done'; s3 = 'bad'; last = 'Rejected'; }
    else { s2 = 'done'; s3 = 'off'; last = 'Expired'; }
    return '<div class="steps" aria-label="Application progress">' +
      '<div class="step ' + s1 + '"><span class="step-dot">' + check + '</span>Applied</div>' +
      '<div class="step ' + s2 + '"><span class="step-dot">' + (s2 === 'done' ? check : clock) + '</span>Under review</div>' +
      '<div class="step ' + s3 + '"><span class="step-dot">' +
        (s3 === 'done' ? check : s3 === 'bad' ? cross : s3 === 'off' ? clock : '') + '</span>' + last + '</div>' +
    '</div>';
  }

  box.innerHTML = apps.map(function (a) {
    const isRejected = a.status === 'rejected';
    const isExpired = a.status === 'expired';
    const dateLabel = isRejected ? 'Outcome' : isExpired ? 'Expired on' : 'Valid till';
    const dateValue = isRejected ? 'Rejected' : (a.expiryDate ? formatDate(a.expiryDate) : 'Awaiting approval');
    return '' +
    '<article class="card">' +
      '<div class="track-top">' +
        '<div class="track-id">' + plateHTML(a.route, true) +
          '<div><span class="pass-id">' + esc(a.id) + '</span><span class="sub-line">' + esc(routeName(a.route)) + '</span></div>' +
          badgeForStatus(a.status) +
        '</div>' +
        (a.status === 'approved' ? '<a class="btn btn-outline btn-sm" href="mypass.html">Show pass</a>' :
         isRejected || isExpired ? '<a class="btn btn-outline btn-sm" href="apply.html">Apply again</a>' : '') +
      '</div>' +
      '<dl class="kv">' +
        '<div><dt>Pass type</dt><dd>' + esc(a.passType) + '</dd></div>' +
        '<div><dt>Amount</dt><dd>₹' + Number(a.amount || 0).toLocaleString('en-IN') + '</dd></div>' +
        '<div><dt>Applied on</dt><dd>' + formatDate(a.appliedDate) + '</dd></div>' +
        '<div><dt>' + dateLabel + '</dt><dd>' + dateValue + '</dd></div>' +
      '</dl>' +
      stepper(a.status) +
    '</article>';
  }).join('');
})();
</script>
</body>
</html>
