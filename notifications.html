<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications - Smart Bus Pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="topbar"></header>

<main class="wrap page page-narrow">
  <div class="page-head">
    <h1>Notifications</h1>
    <p>Updates on your applications and approvals.</p>
  </div>

  <div class="card" id="notifBox" style="padding:8px 12px;"></div>
</main>

<script src="js/app.js"></script>
<script>
(function () {
  const user = requireUser();
  if (!user) return;
  initNavbar('notifications');

  const box = document.getElementById('notifBox');

  async function load() {
    box.innerHTML = loadingHTML();
    try {
      const data = await fetchNotifications();
      const notifs = data.notifications || [];

      if (notifs.length === 0) {
        box.innerHTML = emptyState('bell', 'Nothing new. Updates about your passes will show up here.', null, null);
        return;
      }
      box.innerHTML = notifs.map(function (n) {
        const d = describeNotification(n);
        return '<div class="notif' + (!n.is_read ? ' unread' : '') + '">' +
          '<div class="notif-ic ' + d.kind + '">' + icon(d.icon, 20) + '</div>' +
          '<div><div class="title">' + esc(d.title) + '</div>' +
          '<div>' + esc(n.message) + '</div>' +
          '<div class="time">' + formatDate(n.created_at) + '</div></div>' +
        '</div>';
      }).join('');

      // The list was drawn with the unread highlights; now mark everything read so the bell clears
      if (data.unread_count > 0) {
        await markNotificationsRead();
        setBell(0);
      }
    } catch (e) { showError(box, e, load); }
  }
  load();
})();
</script>
</body>
</html>
